sim_node:
  ros__parameters:
    rate_hz: 50.0
    scenario: stationary_lead        # stationary_lead | slower_lead | hard_brake
    ego_start_speed: 14.0            # m/s (~50 km/h)
    lead_start_gap: 60.0             # m, bumper to bumper
    lead_speed: 0.0                  # m/s (used by slower_lead)
    lead_brake_time: 4.0             # s  (hard_brake: when the lead starts braking)
    lead_decel: 6.0                  # m/s^2 (hard_brake)
    max_accel: 2.0
    max_brake_decel: 8.0
    car_length: 4.5
    lead_width: 1.8
    scan_range_max: 80.0
    scan_fov_deg: 60.0
    scan_rays: 121
    scan_noise_std: 0.03
    radar_decim: 3
    radar_range_std: 0.6
    radar_rate_std: 0.12
    radar_p_dropout: 0.12
    radar_p_false: 0.03
    radar_range_max: 120.0

perception_node:
  ros__parameters:
    path_half_angle_deg: 4.0
    range_rate_alpha: 0.35
    valid_margin: 0.98
    range_var: 0.02
    rate_var: 4.0

radar_node:
  ros__parameters:
    range_var: 0.36
    rate_var: 0.02
    max_range: 120.0

fusion_node:
  ros__parameters:
    sigma_a: 3.0
    gate_chi2: 9.21
    coast_timeout: 0.6
    drop_timeout: 1.5
    publish_rate: 50.0
    r_var_init: 4.0
    c_var_init: 100.0

driver_node:
  ros__parameters:
    target_speed: 14.0
    rate_hz: 20.0

aeb_node:
  ros__parameters:
    max_brake_decel: 8.0
    ttc_warn: 2.0
    ttc_brake: 1.2
    warn_decel_frac: 0.4
    brake_decel_frac: 0.7
    standoff: 2.0
    stop_speed: 0.3
    min_closing_speed: 0.2
    hold_distance: 15.0
    hysteresis: 1.25
